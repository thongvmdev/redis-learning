services:
  redis:
    image: redis:7-alpine
    container_name: redis-learn
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - redis-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight-learn
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge

volumes:
  redis-data:
  redisinsight-data:
